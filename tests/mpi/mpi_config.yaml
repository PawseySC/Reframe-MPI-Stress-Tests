---
# ------------------- #
# COMMON TO ALL TESTS #
# ------------------- #
# Configure the environment
environment:
  # MPI-related environment settings
  mpi:
    # Any modules to load
    modules: [mpi/mpich-aarch64]
    # Any commands to execute to configure environment
    commands: ~
    # Environment variables
    env-vars: {MPICH_ENV_DISPLAY: '1', MPICH_MEMORY_REPORT: '1', MPICH_OFI_VERBOSE: '1'}
# Job options to pass to job script
job-options:
  account: pawsey0001

# ------------------ #
# FOR SPECIFIC TESTS #
# ------------------ #

# Specifics for Pt2Pt test
Pt2Pt:
  system-parameters:
    system:
      - ella:gpu
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '512'
    iadjacent: '0'
    iblocking: '3'
    iverbose: '1'
    idelay: '0'
    irandom: '0'
  job-options:
    num-tasks-per-node: 24
  performance:
    reference-value: 2.e+06
  test-parameters:
    num-nodes: [1] #, 2, 4]

# Specific for CollectiveComms test
CollectiveComms:
  system-parameters:
    system:
      - ella:gpu
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '100'
    iverbose: '1'
  job-options:
    num-tasks-per-node: 24
  performance:
    reference-value:
      bcast: 3.e+06
      gather: 2.e+06
      distribute: 1.5e+06
      reduce: 6.e+03
  test-parameters:
    num-nodes: [1, 2, 4]

# Specific for DelayHang test
# NOTE:These specific values replicate the bug on Setonix
DelayHang:
  system-parameters:
    system:
      - ella:gpu
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '512'
    mode: 'HANGING'
    delay-rank: '45'
    delay-time: '600'
  job-options:
    num-nodes: 2
    num-tasks-per-node: 40

# Specific for CorrectSends test
# NOTE: These specific values replicate the bug on Setonix
CorrectSends:
  system-parameters:
    system:
      - ella:gpu
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '100'
    mode: 'CORRECT_SENDS'
  job-options:
    num-nodes: 1
    num-tasks: 24
    #- num-cpus-per-task: 1 inherit from system-wide omp-num-threads
  test-parameters:
    send-mode: [isend, send, ssend]

# Specific for LargeCommHang test
# NOTE: These specific values replicate the bug on Setonix
LargeCommHang:
  system-parameters:
    system:
      - setonix:work
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '1024'
    iadjacent: '0'
    iblocking: '3'
    iverbose: '1'
    idelay: '0'
    irandom: '0'
  job-options:
    num-nodes: 4
    exclusive: True
    time-limit: 300 # seconds
  test-parameters:
    num-tasks-per-node: [85, 86] # Need to reduce this to fit in ella setup, will likely need to increase ndata, etc. to compensate to trigger issue

# Specific for LargeCommLibfabric test
# NOTE: These specific values replicate the bug on Setonix
LargeCommLibfabric:
  system-parameters:
    system:
      - setonix:work
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '128'
    iadjacent: '0'
    iblocking: '3'
    iverbose: '1'
    idelay: '0'
    irandom: '0'
  job-options:
    num-nodes: 5
    exclusive: True
    time-limit: 300 # seconds
  test-parameters:
    num-tasks-per-node: [149, 150] # Need to reduce this to fit in ella setup, will likely need to increase ndata, etc. to compensate to trigger issue

# Specific for MemoryLeak test
MemoryLeak:
  system-parameters:
    system:
      - ella:gpu
    prog-environ:
      - PrgEnv-gnu
  executable-options:
    ndata: '200'
    iverbose: '1'
  job-options:
    mem-per-cpu: 650 # MB
    exclusive: True
  #cadence: 1.0 # Seconds
  test-parameters:
    num-nodes: [1, 2, 4]
    num-tasks-per-node: 24
